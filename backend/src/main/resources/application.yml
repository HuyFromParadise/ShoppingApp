spring:
  application:
    name: clothing
  # SPRING_PROFILES_ACTIVE only takes effect as a real OS environment variable;
  # inside .env it must be mapped explicitly, because the active profile is
  # resolved before imported config data is applied.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  # Load the local .env file (gitignored) as a properties source.
  # "optional:" keeps startup working when the file is absent.
  # The [ .properties ] hint tells Spring to parse the extension-less file as .properties.
  # Relative paths resolve against the working directory, so both are listed:
  #   run from backend/  -> backend/.env
  #   run from repo root -> backend/.env
  config:
    import: "optional:file:.env[.properties],optional:file:backend/.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clothing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:clothing}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
# The browser origin of the storefront. CORS allows only this origin and the
# refresh cookie is only accepted from it, so it must match the URL the frontend
# runs on. Without it the credentialed auth calls fail in the browser.
FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:http://localhost:3000}

# Checkout money rules. Fees are VND minor units (đồng) and are always computed
# on the server; there is no carrier integration yet (PROJECT_SPEC §14), so this
# is a simple two-option strategy. Change fees here, not in code.
app:
  checkout:
    shipping:
      methods:
        - code: STANDARD
          name: Standard delivery
          fee-minor: 30000
        - code: EXPRESS
          name: Express delivery
          fee-minor: 60000
  # Orders. Stock is deducted at creation (ADR-005), so an unpaid order holds a
  # unit until it is cancelled: this window is when the sweep cancels it and
  # restocks. The sweep cadence is intentionally coarse; it must be shorter than
  # the window for stock to come back promptly.
  orders:
    payment-window-minutes: ${APP_ORDER_PAYMENT_WINDOW_MINUTES:30}
    timeout-sweep-interval-ms: ${APP_ORDER_TIMEOUT_SWEEP_MS:60000}
  # Payments (ADR-007). The mock gateway is always enabled and is clearly labelled
  # in the API. VNPay is enabled only when all three VNPAY_* values are supplied;
  # no credentials are committed. VNPAY_RETURN_URL is the storefront URL the
  # provider redirects the browser to after payment.
  payment:
    public-base-url: ${APP_PAYMENT_PUBLIC_BASE_URL:http://localhost:8080/api/v1}
    vnpay:
      return-url: ${VNPAY_RETURN_URL:}
      expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}

